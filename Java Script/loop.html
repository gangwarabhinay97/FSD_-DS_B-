<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id ="demo">

    </p>
    <script>
        //code for FOR loop
         a=["car1", "car2" ,"car3"];
         let text = " ";
        for(let i=0;i< a.length;i++){
            if(i==1){
                continue ;
            }
            text += a[i] + "<br>";
        }
        document.getElementById("demo").innerHTML = text ;
    </script>
</body>
</html>
